  enabled: true

  # Delay to send announcements (in seconds)
  delay: 120

  # How many players should be required to send announcements?
  required_players: 1

  sound:
    enabled: true
    value: BLOCK_NOTE_BLOCK_PLING
    volume: 1.0
    pitch: 1.0

  # Announcement list
  announcements:
    welcome:
      - "&r"
      - "&6&l⬢ &eИНФОРМАЦИЯ &6&l⬢"
      - "&fЗаходи на наш сайт: &bwww.vaysserv.net"
      - "&fТам много полезного!"
      - "&r"
    discord:
      - "&r"
      - "&9&l⬢ &bDISCORD &9&l⬢"
      - "&fПрисоединяйся к нашему Discord серверу!"
      - "&9discord.gg/vaysserv"
      - "&r"
    shop:
      - "&r"
      - "&d&l⬢ &5МАГАЗИН &d&l⬢"
      - "&fПоддержи сервер — купи привилегию!"
      - "&dbuy.vaysserv.net"
      - "&r"
    rules:
      - "&r"
      - "&a&l⬢ &2ПРАВИЛА &a&l⬢"
      - "&fУважай других игроков и администрацию"
      - "&fИграй честно и получай удовольствие!"
      - "&r"

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~#
# | LAUNCHPAD                                |
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~#

launchpad:
  # Should the launchpad feature be enabled ?
  enabled: true

  # Launch power for launchpad (max 4.0)
  launch_power: 3.0
  launch_power_y: 1.0

  # Top and bottom block required to make a launchpad
  top_block: STONE_PRESSURE_PLATE
  bottom_block: REDSTONE_BLOCK

  # Actions executed upon use of a launchpad
  actions:
    - '[SOUND] ENTITY_BAT_TAKEOFF'
    - '[SOUND] ENTITY_FIREWORK_ROCKET_LAUNCH'

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~#
# | DOUBLE JUMP                              |
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~#

double_jump:
  # Should the double jump feature be enabled?
  enabled: true

  # Launch power for double jump (max 4.0)
  launch_power: 1.2
  launch_power_y: 1.0

  # Cooldown time in seconds (0 to disable)
  cooldown: 2

  # Actions executed upon use of double jump
  actions:
    - '[SOUND] ENTITY_BAT_TAKEOFF'
    - '[SOUND] ENTITY_FIREWORK_ROCKET_TWINKLE'

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~#
# | CHAT MANAGEMENT                          |
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~#

command_block:
  # Should the command blocker feature be enabled?
  enabled: true

  # List of commands that will be blocked
  blocked_commands:
    - /pl
    - /plugins
    - /?
    - /bukkit:?
    - /bukkit:plugins
    - /bukkit:pl
    - /bukkit:help
    - /ver
    - /version
    - /bukkit:version
    - /bukkit:ver
    - /icanhasbukkit
    - /about
    - /help
    - /me
    - /tell
    - /msg

anti_swear:
  # Should the anti-swear feature be enabled?
  enabled: true

  # List of words that will be blocked
  blocked_words:
    - fuck
    - shit
    - bitch
    - asshole
    - cunt
    - nigger
    - faggot
    - pizdec
    - huy
    - blyat

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~#
# | WORLD EVENT SETTINGS                     |
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~#

world_settings:

  # Player
  disable_hunger_loss: true
  disable_fall_damage: true
  disable_player_pvp: true
  disable_void_death: true
  disable_fire_damage: true
  disable_drowning: true
  disable_off_hand_swap: true # Requires 1.9+

  # Misc
  disable_weather_change: true
  disable_death_message: true
  disable_mob_spawning: true

  # Item entities
  disable_item_drop: true
  disable_item_pickup: true

  # Blocks
  disable_block_break: true
  disable_block_place: true
  disable_block_interact: true # Chest, furnace, crop tample, etc
  disable_block_burn: true
  disable_block_fire_spread: true
  disable_block_leaf_decay: true

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~#
# | PLAYER JOIN EVENT                        |
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~#

join_leave_messages:
  # Should deluxehub handle join/quit messages?
  enabled: true

  # Set to '' if you want silent join/quit messages
  join_message: "&a&l+ &7%player% &aзашел на сервер"
  quit_message: "&c&l- &7%player% &cпокинул сервер"

# Actions executed upon join
join_events:
  - "[MESSAGE] &8&m----------------------------------------"
  - "[MESSAGE] &r"
  - "[MESSAGE] &6&l⬢ &eДобро пожаловать, &b&l%player% &eна VAYS SERV! &6&l⬢"
  - "[MESSAGE] &r"
  - "[MESSAGE] &b◉ &fСайт: &bwww.vaysserv.net"
  - "[MESSAGE] &d◉ &fМагазин: &dbuy.vaysserv.net"
  - "[MESSAGE] &9◉ &fDiscord: &9discord.gg/vaysserv"
  - "[MESSAGE] &r"
  - "[MESSAGE] &a✨ &fИгроков онлайн: &a%online% &f/ &a%online_max%"
  - "[MESSAGE] &r"
  - "[MESSAGE] &8&m----------------------------------------"
  - "[TITLE] &6&lVAYS SERV;&e&l%player%;5;20;5"
  - "[SOUND] ENTITY_PLAYER_LEVELUP"
  - "[ACTIONBAR] &a&l⬢ &fДобро пожаловать, &b%player% &a&l⬢"

join_settings:
  # Should we teleport the player to the spawn point (if set) on join?
  spawn_join: true
  # Should we heal the player?
  heal: true
  # Should we extinguish the player?
  extinguish: true
  # Should we clear their inventory?
  clear_inventory: false
  # Spawn a firework on join
  firework:
    # Should we send a firework on join?
    enabled: true
    # Should we only send the firework on their first join?
    first_join_only: false

    type: BALL_LARGE
    power: 1
    flicker: true
    trail: true
    colors:
      - AQUA
      - ORANGE
      - YELLOW
      - WHITE

