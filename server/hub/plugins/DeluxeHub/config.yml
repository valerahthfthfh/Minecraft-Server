    - ""
    - " &b◉ &fСайт: &bwww.vaysserv.net"
    - " &d◉ &fМагазин: &dbuy.vaysserv.net"
    - " &9◉ &fDiscord: &9discord.gg/vaysserv"
    - " &a◉ &fВКонтакте: &avk.com/vaysserv"
